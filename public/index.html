<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clover Proxy</title>
  <style>
    body { background: #0d1117; color: #e6edf3; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    h1 { font-size: 56px; font-weight: 800; color: #56d364; margin-bottom: 20px; }
    input { width: 450px; padding: 12px 18px; border-radius: 10px; border: 1px solid #30363d; background: #161b22; color: white; font-size: 16px; outline: none; }
  </style>
</head>
<body>
  <h1>Clover</h1>
  <input type="text" id="address" placeholder="Search DuckDuckGo or enter URL..." autofocus>
  <script>
    const input = document.getElementById('address');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let url = input.value.trim();
        if (!url.startsWith('http') && !url.includes('.')) {
          url = 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
        } else if (!url.startsWith('http')) {
          url = 'https://' + url;
        }
        window.location.href = url;
      }
    });
  </script>
</body>
</html>
